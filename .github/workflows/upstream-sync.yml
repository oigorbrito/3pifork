name: Upstream Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch --prune upstream main

      - name: Prepare sync branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B upstream-sync origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit --no-ff upstream/main
          git push --force-with-lease origin HEAD:upstream-sync

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update upstream PR
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: upstream-sync
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.HEAD_BRANCH}`;
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head,
            });

            if (prs.length > 0) {
              core.info(`Upstream sync PR already open: #${prs[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore: sync upstream main',
              head: process.env.HEAD_BRANCH,
              base: 'main',
              body: [
                'Automated synchronization from the upstream repository.',
                '',
                'Source: https://github.com/earendil-works/pi',
                'Target: `main`',
                '',
                'This workflow never writes upstream changes directly to `main`; it creates a normal PR so the repository CI and PR gates can validate the update before merge.',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`Created upstream sync PR #${pr.data.number}`);
